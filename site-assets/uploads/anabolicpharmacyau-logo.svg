<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&amp;display=swap');
    </style>
  </defs>
  <!-- Hexagon badge -->
  <polygon points="30,4 50,16 50,40 30,52 10,40 10,16" fill="none" stroke="#c9a84c" stroke-width="2.5"/>
  <line x1="30" y1="4" x2="30" y2="10" stroke="#c9a84c" stroke-width="1.5" opacity="0.5"/>
  <line x1="30" y1="46" x2="30" y2="52" stroke="#c9a84c" stroke-width="1.5" opacity="0.5"/>
  <!-- Inner glow dot -->
  <circle cx="30" cy="28" r="5" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.6"/>
  <circle cx="30" cy="28" r="2" fill="#c9a84c"/>
  <!-- AP Wordmark -->
  <text x="66" y="30" fill="#f5f5f0" font-family="Montserrat, Arial, sans-serif" font-weight="900" font-size="24" letter-spacing="-0.5">ANABOLIC</text>
  <!-- Thin divider line -->
  <line x1="66" y1="35" x2="288" y2="35" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>
  <!-- Subtext -->
  <text x="66" y="50" fill="#c9a84c" font-family="Montserrat, Arial, sans-serif" font-weight="400" font-size="11" letter-spacing="5">PHARMACY  AU</text>
</svg>
